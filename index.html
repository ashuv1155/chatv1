    <meta name="description" content="Anonymous real-time group and direct messaging with random handles, 24-hour disappearing messages, and zero personal profile exposure." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('buddychat_theme') || 'system';
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = pref === 'dark' || (pref === 'system' && systemDark);
          document.documentElement.classList.toggle('dark', useDark);
          document.documentElement.style.colorScheme = useDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
